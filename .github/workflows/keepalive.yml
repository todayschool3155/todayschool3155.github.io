# Supabase 무료 플랜은 7일간 요청이 없으면 일시정지됩니다 (방학 등).
# 이 작업이 3일마다 서버를 한 번 호출해 깨워 둡니다. (학생 데이터는 조회하지 않음)
# 필요한 설정: 저장소 Settings > Secrets and variables > Actions 에
#   SUPABASE_URL  (예: https://abcd1234.supabase.co)
#   SUPABASE_KEY  (anon 또는 publishable 키)
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL secret 없음 - 건너뜀"; exit 0; fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/api_ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
